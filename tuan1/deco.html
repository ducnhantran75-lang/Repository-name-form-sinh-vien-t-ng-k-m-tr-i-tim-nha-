<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thu Trang ❤️</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: radial-gradient(
          circle at center,
          #351126 0%,
          #150914 45%,
          #050307 100%
        );

        font-family: Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        cursor: pointer;
      }

      /* =========================
           ÁNH SÁNG PHÍA SAU TIM
        ========================= */

      .background-glow {
        position: fixed;

        width: 450px;
        height: 450px;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background: #ff248f;

        filter: blur(130px);

        opacity: 0.15;

        pointer-events: none;
      }

      /* =========================
           CHỮ HƯỚNG DẪN
        ========================= */

      .instruction {
        position: fixed;

        width: 100%;

        bottom: 8%;

        text-align: center;

        color: rgba(255, 255, 255, 0.65);

        font-size: 13px;

        letter-spacing: 5px;

        animation: blink 1.8s infinite alternate;

        pointer-events: none;
      }

      @keyframes blink {
        from {
          opacity: 0.3;
        }

        to {
          opacity: 1;
        }
      }

      /* =========================
           PHẦN SAU KHI TIM VỠ
        ========================= */

      .ending {
        position: fixed;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%) scale(0.5);

        width: 90%;

        text-align: center;

        opacity: 0;

        pointer-events: none;

        transition:
          opacity 1.2s ease,
          transform 1.2s cubic-bezier(0.17, 0.89, 0.32, 1.3);
      }

      .ending.show {
        opacity: 1;

        transform: translate(-50%, -50%) scale(1);
      }

      /* =========================
           TÊN THU TRANG
        ========================= */

      .name {
        font-size: clamp(42px, 9vw, 90px);

        font-weight: bold;

        letter-spacing: 4px;

        color: white;

        margin-bottom: 25px;

        text-shadow:
          0 0 10px #ff75bb,
          0 0 25px #ff4da6,
          0 0 50px #ff1687,
          0 0 90px #ff1687;

        animation: nameGlow 2s infinite alternate;
      }

      @keyframes nameGlow {
        from {
          text-shadow:
            0 0 10px #ff75bb,
            0 0 25px #ff4da6,
            0 0 50px #ff1687;
        }

        to {
          text-shadow:
            0 0 20px white,
            0 0 40px #ff75bb,
            0 0 80px #ff1687;
        }
      }

      /* =========================
           ẢNH CON CHÓ
        ========================= */

      .dog {
        width: clamp(150px, 30vw, 270px);

        height: clamp(150px, 30vw, 270px);

        object-fit: cover;

        border-radius: 50%;

        border: 4px solid rgba(255, 255, 255, 0.9);

        box-shadow:
          0 0 15px #ff69b4,
          0 0 35px #ff248f,
          0 0 70px rgba(255, 36, 143, 0.6);

        animation: dogFloat 3s ease-in-out infinite;
      }

      @keyframes dogFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      .caption {
        margin-top: 18px;

        color: rgba(255, 255, 255, 0.8);

        font-size: 14px;

        letter-spacing: 2px;
      }

      /* =========================
           FLASH KHI TIM VỠ
        ========================= */

      .flash {
        position: fixed;

        inset: 0;

        background: white;

        opacity: 0;

        pointer-events: none;
      }

      .flash.active {
        animation: flash 0.6s ease;
      }

      @keyframes flash {
        0% {
          opacity: 0;
        }

        20% {
          opacity: 0.8;
        }

        100% {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="background-glow"></div>

    <canvas id="canvas"></canvas>

    <div class="instruction" id="instruction">✦ CHẠM VÀO TRÁI TIM ✦</div>

    <!-- =========================
         PHẦN HIỆN SAU KHI VỠ
    ========================= -->

    <div class="ending" id="ending">
      <div class="name">Thu Trang ❤️</div>

      <!-- ẢNH CON CHÓ -->
      <img src="tuan1/cho.png" class="dog" alt="Con chó" />

      <div class="caption">:)))</div>
    </div>

    <div class="flash" id="flash"></div>

    <script>
      const canvas = document.getElementById("canvas");

      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;

      canvas.height = window.innerHeight;

      let particles = [];

      let exploded = false;

      let assembling = true;

      /*
        =====================================
        CLASS HẠT
        =====================================
        */

      class Particle {
        constructor(targetX, targetY) {
          /*
                Vị trí ban đầu:
                nằm ngẫu nhiên bên ngoài màn hình
                */

          this.x = Math.random() * canvas.width;

          this.y = Math.random() * canvas.height;

          /*
                Điểm cuối:
                vị trí hạt trong trái tim
                */

          this.targetX = targetX;

          this.targetY = targetY;

          /*
                Kích thước hạt
                */

          this.size = Math.random() * 1.8 + 0.6;

          /*
                Màu
                */

          const colors = [
            "#ffffff",

            "#ffb6d9",

            "#ff79bd",

            "#ff4fa3",

            "#ff2387",

            "#ffd6e9",
          ];

          this.color = colors[Math.floor(Math.random() * colors.length)];

          this.alpha = Math.random() * 0.7 + 0.3;

          /*
                Tốc độ bay vào
                */

          this.speed = Math.random() * 0.015 + 0.008;

          /*
                Góc / độ trễ
                */

          this.delay = Math.random() * 1000;

          this.finished = false;

          /*
                Tốc độ khi nổ
                */

          this.vx = 0;

          this.vy = 0;
        }

        /*
            ==============================
            UPDATE
            ==============================
            */

        update() {
          /*
                ------------------------------
                GIAI ĐOẠN 1:
                BAY VÀO TRÁI TIM
                ------------------------------
                */

          if (!exploded) {
            const dx = this.targetX - this.x;

            const dy = this.targetY - this.y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            /*
                    Khi còn xa thì bay nhanh
                    */

            if (distance > 2) {
              this.x += dx * this.speed;

              this.y += dy * this.speed;
            } else {
              this.finished = true;
            }
          } else {

          /*
                ------------------------------
                GIAI ĐOẠN 2:
                TIM VỠ
                ------------------------------
                */
            this.x += this.vx;

            this.y += this.vy;

            /*
                    Ma sát
                    */

            this.vx *= 0.97;

            this.vy *= 0.97;

            /*
                    Trọng lực nhẹ
                    */

            this.vy += 0.025;

            /*
                    Hạt nhỏ dần
                    */

            this.alpha -= 0.006;

            this.size *= 0.992;
          }
        }

        /*
            ==============================
            DRAW
            ==============================
            */

        draw() {
          if (this.alpha <= 0) return;

          ctx.beginPath();

          ctx.arc(
            this.x,

            this.y,

            this.size,

            0,

            Math.PI * 2,
          );

          ctx.fillStyle = this.color;

          ctx.globalAlpha = this.alpha;

          /*
                Glow của hạt
                */

          ctx.shadowBlur = 12;

          ctx.shadowColor = this.color;

          ctx.fill();

          ctx.globalAlpha = 1;

          ctx.shadowBlur = 0;
        }
      }

      /*
        =====================================
        TẠO TRÁI TIM
        =====================================
        */

      function createHeart() {
        particles = [];

        const centerX = canvas.width / 2;

        const centerY = canvas.height / 2;

        /*
            Tạo rất nhiều hạt
            */

        for (let i = 0; i < 5000; i++) {
          /*
                Random điểm trong trái tim
                */

          const t = Math.random() * Math.PI * 2;

          const r = Math.sqrt(Math.random());

          /*
                Công thức trái tim
                */

          const x = 16 * Math.pow(Math.sin(t), 3);

          const y = -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          );

          /*
                Kích thước trái tim
                */

          const scale = Math.min(canvas.width, canvas.height) * 0.017;

          const targetX = centerX + x * scale * r;

          const targetY = centerY + y * scale * r;

          particles.push(new Particle(targetX, targetY));
        }
      }

      /*
        =====================================
        ANIMATION
        =====================================
        */

      function animate() {
        /*
            Tạo bóng mờ nhẹ
            */

        ctx.fillStyle = "rgba(5,3,7,0.18)";

        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach((particle) => {
          particle.update();

          particle.draw();
        });

        requestAnimationFrame(animate);
      }

      /*
        =====================================
        NỔ TRÁI TIM
        =====================================
        */

      function explode() {
        if (exploded) return;

        exploded = true;

        /*
            Ẩn hướng dẫn
            */

        document.getElementById("instruction").style.display = "none";

        /*
            Flash màn hình
            */

        document.getElementById("flash").classList.add("active");

        const centerX = canvas.width / 2;

        const centerY = canvas.height / 2;

        /*
            Cho từng hạt bay ra
            */

        particles.forEach((particle) => {
          const dx = particle.x - centerX;

          const dy = particle.y - centerY;

          const distance = Math.sqrt(dx * dx + dy * dy) || 1;

          /*
                    Tốc độ nổ
                    */

          const force = Math.random() * 10 + 4;

          particle.vx = (dx / distance) * force;

          particle.vy = (dy / distance) * force;

          /*
                    Thêm hướng ngẫu nhiên
                    */

          particle.vx += (Math.random() - 0.5) * 5;

          particle.vy += (Math.random() - 0.5) * 5;
        });

        /*
            Sau 1 giây:
            hiện Thu Trang + ảnh chó
            */

        setTimeout(() => {
          document.getElementById("ending").classList.add("show");
        }, 1000);
      }

      /*
        =====================================
        CLICK
        =====================================
        */

      canvas.addEventListener("click", explode);

      /*
        Điện thoại
        */

      canvas.addEventListener("touchstart", explode);

      /*
        =====================================
        RESIZE
        =====================================
        */

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;

        canvas.height = window.innerHeight;
      });

      /*
        =====================================
        CHẠY
        =====================================
        */

      createHeart();

      animate();
    </script>
  </body>
</html>
